<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KeyShift Options</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 300px; padding: 16px; background: #ffffff; color: #1e293b; font-size: 13px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .title { font-weight: 700; font-size: 15px; color: #0f172a; display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 10px; background: #e0f2fe; color: #0284c7; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
    .section { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #475569; font-size: 12px; }
    select { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #cbd5e1; background: #f8fafc; font-size: 13px; outline: none; }
    select:focus { border-color: #3b82f6; }
    .btn-convert { width: 100%; padding: 10px; background: #2563eb; color: #ffffff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s; }
    .btn-convert:hover { background: #1d4ed8; }
    .shortcut-tip { margin-top: 12px; padding: 8px 10px; background: #f1f5f9; border-radius: 6px; font-size: 11px; color: #64748b; line-height: 1.4; display: flex; align-items: center; justify-content: space-between; }
    .kbd { background: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 11px; font-weight: 600; color: #334155; border: 1px solid #cbd5e1; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 12px; color: #475569; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>⌨️ KeyShift</span>
      <span class="badge">v1.0</span>
    </div>
  </div>

  <div class="section">
    <label for="pairSelect">Active Language Pair</label>
    <select id="pairSelect">
      <option value="fa-en">🇮🇷 Persian (Farsi) ↔ 🇺🇸 English</option>
      <option value="ar-en">🇸🇦 Arabic ↔ 🇺🇸 English</option>
      <option value="ru-en">🇷🇺 Russian ↔ 🇺🇸 English</option>
    </select>
  </div>

  <button id="convertBtn" class="btn-convert">
    <span>🔄 Convert Current Input</span>
  </button>

  <div class="shortcut-tip">
    <span>Instant Shortcut:</span>
    <span class="kbd">Alt + Shift + X</span>
  </div>

  <div class="toggle-row">
    <span>Show Floating Icon in Inputs</span>
    <input type="checkbox" id="floatingToggle" checked>
  </div>

  <script src="popup.js"></script>
</body>
</html>
